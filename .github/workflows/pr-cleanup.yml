name: On PR Closed (cleanup pre-release image)

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  # Check name: `cleanup / cleanup`
  cleanup:
    # PRs from forks have no image
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: Aam-Digital/.github/.github/workflows/pr-image-cleanup.yml@feat/reusable-workflows # TODO switch to @v1
    permissions:
      actions: write # cancel a still running PR image build, which would otherwise push pr-<n> after the cleanup
      packages: write # the package is linked to this repository, so the job token can delete its versions
    with:
      build-workflows: pr-release.yml
