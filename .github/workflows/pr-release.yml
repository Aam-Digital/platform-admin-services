name: On PR (build & publish pre-release image)

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - run: npx prettier --check .
      - run: npx eslint . --max-warnings=0

      - name: Run unit tests
        run: npm test

      - name: Run e2e tests
        run: npm run test:e2e

  # Check names: `build / build (linux/amd64)`, `build / merge`
  build:
    needs: test
    uses: Aam-Digital/.github/.github/workflows/docker-image.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      images: ghcr.io/aam-digital/platform-admin-services
      tags: pr-${{ github.event.number }}
      platforms: linux/amd64
      # PRs from forks cannot push; only check that the image builds
      push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      # package.json's version is what the app reports to Sentry. npm only accepts semver, hence `0.0.0-pr.<n>`;
      # the image's version label is its tag `pr-<n>`.
      prepare: npm version "0.0.0-pr.${{ github.event.number }}" --no-git-tag-version --allow-same-version
