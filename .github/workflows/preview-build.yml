name: Publish preview container image

on:
  push:
    branches:
      - preview

jobs:
  build:
    name: Build and publish preview container image
    uses: ./.github/workflows/_build.yml
    with:
      docker_tags: |
        type=raw,value=preview
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: write
