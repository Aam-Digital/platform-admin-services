name: On Semantic Release (build & publish image)

on:
  release:
    types: [published] # created with the GH_TOKEN PAT, releases by the GITHUB_TOKEN trigger no workflows

permissions: {}

jobs:
  # Check names: `build / build (linux/amd64)`, `build / build (linux/arm64)`, `build / merge`
  build:
    uses: Aam-Digital/.github/.github/workflows/docker-image.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      images: ghcr.io/aam-digital/platform-admin-services
      # Tag `<version>` (e.g. `1.7.7`, also the `org.opencontainers.image.version` label);
      # full releases also `stable` and `latest`
      version: ${{ github.event.release.tag_name }}
      stable: ${{ !github.event.release.prerelease }}
      # package.json's version is what the app reports to Sentry
      prepare: npm version "$VERSION" --no-git-tag-version --allow-same-version

  # After a full release, the edge images (`*-edge.*`) of the finished cycle are no longer needed. The image `edge`
  # points to is kept.
  prune-edge-images:
    if: ${{ !github.event.release.prerelease }}
    needs: build
    uses: Aam-Digital/.github/.github/workflows/image-cleanup.yml@v1
    permissions:
      actions: write
      packages: write
    with:
      tags: "*-edge.*"
