name: On Branch Update

on:
  push:
    branches:
      - main
      - "**"

permissions:
  contents: read
  id-token: write # for QLTY code coverage (https://docs.qlty.sh/migration/coverage)

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - run: npx prettier --check .
      - run: npx eslint . --max-warnings=0

      - name: Run unit tests with coverage
        run: npm run test:cov

      - uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
        with:
          oidc: true
          files: coverage/lcov.info

      - name: Run e2e tests
        run: npm run test:e2e

  # Check name: `Create Release / release`. Auto release mode: every releasable push to main becomes a full release.
  release:
    name: Create Release
    if: github.ref == 'refs/heads/main'
    needs:
      - test
    uses: Aam-Digital/.github/.github/workflows/release.yml@feat/reusable-workflows # TODO switch to @v1
    permissions:
      contents: read # everything that writes uses the GH_TOKEN PAT (its releases trigger the image build)
    with:
      type: release
    secrets:
      token: ${{ secrets.GH_TOKEN }}
